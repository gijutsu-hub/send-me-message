<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sumon's OLED Messenger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #141e30, #243b55);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.07);
        padding: 25px;
        width: 90%;
        max-width: 420px;
        border-radius: 16px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        animation: drop 0.7s ease-out;
    }

    @keyframes drop {
        0% { transform: translateY(-30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    h2 {
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 700;
    }

    p {
        font-size: 14px;
        opacity: 0.8;
    }

    input[type="text"] {
        width: 90%;
        padding: 12px;
        margin: 10px 0;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.15);
        color: #fff;
        text-align: center;
        transition: 0.3s;
    }
    input[type="text"]:focus {
        background: rgba(255,255,255,0.25);
        transform: scale(1.03);
    }

    button {
        width: 90%;
        padding: 14px;
        font-size: 18px;
        margin-top: 15px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #00c6ff, #0072ff);
        color: #fff;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 4px 12px rgba(0, 114, 255, 0.4);
        transition: 0.25s;
    }
    button:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(0, 114, 255, 0.6);
    }

    .footer {
        margin-top: 15px;
        font-size: 12px;
        opacity: 0.6;
    }

</style>
</head>

<body>
<div class="container">
    <h2>📟 OLED Messenger</h2>
    <p>Send text directly to Sumon's Pico OLED display</p>

    <form action="http://115.187.49.219/send" method="get">
        <input type="text" name="from" placeholder="Your Name" required>
        <input type="text" name="msg" placeholder="Your Message" required>
        <button type="submit">🚀 Send to OLED</button>
    </form>

    <div class="footer">
        Powered by Raspberry Pi Pico W • OLED API
    </div>
</div>
</body>
</html>
